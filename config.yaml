# scoreflow 配置文件
# 命令行 --set KEY=VALUE 可临时覆盖任意项，无需改本文件

paths:
  # HOMR 发行版自带的嵌入式 Python（识别引擎入口）
  homr_python: D:\HOMR\homr-main\python_embed\python.exe
  # HOMR 主目录（模型权重在 homr/ 子目录下，运行时作为工作目录）
  homr_dir: D:\HOMR\homr-main
  # 乐谱 PDF 输入目录（也可命令行直接传 PDF 路径）
  input_dir: D:\HOMR\input
  # 输出根目录（页面图片、MusicXML、分析报告都放这里）
  output_dir: D:\HOMR\output

pipeline:
  dpi: 300        # PDF 渲染 DPI，识别不清可调到 400
  gpu: "no"       # auto | no | force（无 NVIDIA 显卡用 "no"，注意加引号避免被当布尔值）
  timeout: 600    # 单页识别超时（秒）

analysis:
  # 和弦处理: top=取最高音(旋律线) / skip=跳过和弦 / all=展开全部和弦音
  chord_mode: top
  # 占比的分母是否包含没有音符的小节
  count_empty_measures: false
  # 滑动窗口是否允许跨小节线（false = 只统计小节内部的相邻音群）
  across_barlines: false
  # 双手拆分诊断：合并后声部跨度 >= N 半音时，自动拆成右手/左手轨道再识别。
  # 钢琴单手舒适跨度约 8–9 度，默认 16 = 十度；设为 0 或删除则关闭。
  hand_split_threshold: 16

  # 启用哪些音群特征 + 各自参数
  # 口径说明：《音型(音群)集》——伸张把位(单调+>12半音,加权2)、
  # 收缩把位(5音4音程和<6半音,加权1)、连续十六分(5个,加权2)、
  # 连续八分(3个,加权1)、连续和弦(3个且≥3音叠置,加权2)、
  # 连续音程(3个且2音叠置,加权1)；若某小节双手同时出现某技术，加权×2。
  features:
    stretched_grip:
      enabled: true
      params:
        threshold: 12    # 半音数，12 = 八度
        monotonic: true  # 《音型集》口径：要求 3 音走向相同（伸张把位）
        arpeggio_aware: false  # 琶音感知开关：true 时分解和弦音型（3音音级可
                               # 嵌入同一三/七和弦）不判为伸张把位，缓解琶音跑动
                               # 织体上的系统性误报（详见 README）
    big_single_leap:
      enabled: false
      params:
        threshold: 8     # 半音数，8 = 小六度
    consecutive_sixteenths:
      enabled: true
      params:
        window_size: 5   # 《音型集》口径：连续 5 个十六分音符（早期为 6）
    consecutive_eighths:
      enabled: true
      params:
        window_size: 3   # 连续 3 个八分音符
    consecutive_chords:
      enabled: true
      params:
        window_size: 3   # 《音型集》口径：连续 3 个和弦（早期为 6）
        min_notes: 3     # 和弦 = 3 音及以上叠置
    consecutive_intervals:
      enabled: true
      params:
        window_size: 3   # 连续 3 个音程
        exact: true      # 严格要求 2 音叠置
    contracted_grip:
      enabled: true
      params:
        threshold: 6     # 4 个音程之和 < 6 半音（减五度）
    # 新特征在 scoreflow/analysis/features/ 里写好后，在这里加：
    # my_feature:
    #   enabled: true
    #   params: {pitch: C5}
